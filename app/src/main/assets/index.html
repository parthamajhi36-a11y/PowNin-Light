<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090909">

    <title>POWNIN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">P</div>

        <div class="brand">
            <h1>POWNIN</h1>
            <p>SMART AI ASSISTANT</p>
        </div>

        <div class="status-box">
            <span class="status-dot"></span>
            <span id="status" class="status">READY</span>
        </div>

    </header>

    <!-- MASCOT AREA -->
    <section class="mascot-section">

        <div class="mascot-frame" id="mascotFrame">

            <!-- Authorized mascot image can be added later -->
            <div class="mascot-placeholder" id="mascotPlaceholder">
                <div class="mascot-symbol">P</div>
                <p>POWNIN</p>
                <span>AI COMPANION</span>
            </div>

            <div class="voice-ring ring-one"></div>
            <div class="voice-ring ring-two"></div>

        </div>

        <div class="assistant-state">
            <span class="state-indicator"></span>
            <span id="assistantState">SYSTEM READY</span>
        </div>

    </section>

    <!-- WELCOME -->
    <section class="welcome">

        <h2>Hello! I am POWNIN.</h2>

        <p>
            Your personal AI assistant.
            Ready to help you.
        </p>

    </section>

    <!-- MODE DISPLAY -->
    <section class="mode-section">

        <div class="mode-heading">
            <span>AI MODE</span>
            <span id="modeLabel">OFFLINE</span>
        </div>

        <div class="mode-options">

            <button
                type="button"
                class="mode-btn active"
                id="offlineModeBtn"
                data-mode="offline">
                OFFLINE
            </button>

            <button
                type="button"
                class="mode-btn"
                id="onlineModeBtn"
                data-mode="online">
                ONLINE
            </button>

            <button
                type="button"
                class="mode-btn"
                id="hybridModeBtn"
                data-mode="hybrid">
                HYBRID
            </button>

        </div>

    </section>

    <!-- CHAT -->
    <section class="chat-section">

        <div class="section-heading">
            <span>CONVERSATION</span>

            <button
                type="button"
                id="clearChatBtn"
                class="clear-btn">
                CLEAR
            </button>
        </div>

        <div class="chat" id="chat">

            <div class="message bot">
                Hello! How can I help you today?
            </div>

        </div>

    </section>

    <!-- INPUT -->
    <section class="input-section">

        <div class="controls">

            <input
                id="commandInput"
                type="text"
                placeholder="Message POWNIN..."
                autocomplete="off"
                maxlength="2000">

            <button
                type="button"
                id="sendBtn">
                SEND
            </button>

        </div>

        <div class="voice-controls">

            <button
                type="button"
                id="voiceBtn">
                🎤 VOICE INPUT
            </button>

            <button
                type="button"
                id="stopBtn">
                ■ STOP VOICE
            </button>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>

        <span>POWNIN AI</span>
        <span>ANDROID ASSISTANT</span>

    </footer>

</main>

<!-- MATH ENGINE FIRST -->
<script src="math-engine.js"></script>

<!-- MAIN BRAIN SECOND -->
<script src="app.js"></script>

</body>
</html>
